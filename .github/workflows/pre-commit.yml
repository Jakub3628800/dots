---
name: pre-commit

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install syntax and test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh neovim
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          prek-version: '0.5.11'
        env:
          SKIP: ${{ github.ref == 'refs/heads/master' && 'no-commit-to-branch' || '' }}
