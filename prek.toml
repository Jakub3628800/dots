# Hook configuration for prek.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# Base hooks
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
name = "prek: trim trailing whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"
name = "prek: fix end of file"

[[repos.hooks]]
id = "check-yaml"
name = "prek: check YAML"

[[repos.hooks]]
id = "check-json"
name = "prek: check JSON"

[[repos.hooks]]
id = "check-toml"
name = "prek: check TOML"

[[repos.hooks]]
id = "check-added-large-files"
name = "prek: check large files"

[[repos.hooks]]
id = "check-merge-conflict"
name = "prek: check merge conflicts"

[[repos.hooks]]
id = "detect-private-key"
name = "prek: detect private keys"

[[repos.hooks]]
id = "no-commit-to-branch"
name = "prek: prevent commits to main or master"
always_run = false
args = ["--branch", "main", "--branch", "master"]

[[repos.hooks]]
id = "check-case-conflict"
name = "prek: check case conflicts"

[[repos.hooks]]
id = "check-executables-have-shebangs"
name = "prek: check executable shebangs"

[[repos.hooks]]
id = "check-symlinks"
name = "prek: check symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"
name = "prek: check replaced symlinks"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks: detect secrets"

# Shell hooks
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck: check shell scripts"
files = '(^|/)([^/]*\.sh|install-nvim\.sh|screencopy|screensave|cmd-picker|\.bash_aliases)$'

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"

[[repos.hooks]]
id = "shfmt"
name = "shfmt: format shell scripts"
args = ["--write", "--indent", "4"]
files = '(^|/)([^/]*\.sh|screencopy|screensave|cmd-picker|\.bash_aliases)$'
exclude_types = ["csh", "tcsh", "zsh"]

# Python hooks
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"

[[repos.hooks]]
id = "ruff-check"
name = "ruff: check Python"
args = [
  "--isolated",
  "--target-version=py312",
  "--select=ALL",
  "--fix",
  # COM812 overlaps the formatter; D203/D213 conflict with D211/D212.
  # CPY001 would require inventing a repository copyright-header policy.
  "--ignore=COM812,D203,D213,CPY001",
  # Keep assertions native to the existing dependency-free unittest runner.
  "--per-file-ignores=tests/*.py:PT009",
  "--per-file-ignores=tests/*.py:PT027",
]

[[repos.hooks]]
id = "ruff-format"
name = "ruff: format Python"
args = ["--isolated", "--target-version=py312"]

# Local syntax checks and regression tests
[[repos]]
repo = "local"

[[repos.hooks]]
id = "zsh-syntax"
name = "zsh: check syntax"
entry = "zsh -n"
language = "system"
files = '(^|/)(\.zshrc|.*\.zsh)$'

[[repos.hooks]]
id = "script-tests"
name = "unittest: run repository tests"
entry = "python3 -m unittest discover -s tests"
language = "system"
pass_filenames = false
files = '^tests/.*\.py$|^(Makefile|(core|desktop|nvim)/Makefile|nvim/.*\.(lua|sh))$'

[[repos.hooks]]
id = "commit-message"
name = "grep: check Conventional Commits"
language = "system"
stages = ["commit-msg"]
entry = '''sh -c '
  types="build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
  grep -m1 -Ev "^(#|$)" "$1" |
    grep -Eiq "^(($types)(\([^)]+\))?!?: .+|(Merge|Revert) |(amend|fixup|squash)! )" && exit
  echo "Use type(scope): description, for example: fix(core): handle empty input" >&2
  exit 1
' sh'''

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.6.0"

[[repos.hooks]]
id = "stylua"
name = "stylua: format Lua"
files = '^nvim/.+\.lua$'

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.52.2"

[[repos.hooks]]
id = "typos"
name = "typos: check spelling"
# Report rather than rewrite identifiers or configuration values.
args = ["--force-exclude"]

# GitHub Actions hooks
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"
name = "actionlint: check GitHub Actions"
description = "Lint GitHub Actions workflow files"
files = '^\.github/workflows/.*\.(yml|yaml)$'
