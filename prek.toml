# Hook configuration for prek.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# Base hooks
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
name = "Trim trailing whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"
name = "Fix end of files"

[[repos.hooks]]
id = "check-yaml"
name = "Check YAML"

[[repos.hooks]]
id = "check-json"
name = "Check JSON"

[[repos.hooks]]
id = "check-toml"
name = "Check TOML"

[[repos.hooks]]
id = "check-added-large-files"
name = "Check for added large files"

[[repos.hooks]]
id = "check-merge-conflict"
name = "Check for merge conflict strings"

[[repos.hooks]]
id = "detect-private-key"
name = "Detect private keys"

[[repos.hooks]]
id = "no-commit-to-branch"
name = "Prevent commits to main/master"
always_run = false
args = ["--branch", "main", "--branch", "master"]

[[repos.hooks]]
id = "check-case-conflict"
name = "Check for case conflicts"

[[repos.hooks]]
id = "check-executables-have-shebangs"
name = "Check executables have shebangs"

[[repos.hooks]]
id = "check-symlinks"
name = "Check tracked symlink targets"

[[repos.hooks]]
id = "destroyed-symlinks"
name = "Check for symlinks replaced with text"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"
name = "Detect hardcoded secrets with Gitleaks"

# Shell hooks
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"

[[repos.hooks]]
id = "shellcheck"
name = "Lint shell scripts with ShellCheck"
files = '(^|/)([^/]*\.sh|install-nvim\.sh|screencopy|screensave|cmd-picker|\.bash_aliases)$'

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"

[[repos.hooks]]
id = "shfmt"
name = "Format shell scripts with shfmt"
args = ["--write", "--indent", "4"]
files = '(^|/)([^/]*\.sh|screencopy|screensave|cmd-picker|\.bash_aliases)$'
exclude_types = ["csh", "tcsh", "zsh"]

# Python hooks
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.7"

[[repos.hooks]]
id = "ruff-check"
name = "Lint Python with Ruff"
args = [
  "--isolated",
  "--target-version=py312",
  "--select=ALL",
  "--fix",
  # COM812 overlaps the formatter; D203/D213 conflict with D211/D212.
  # CPY001 would require inventing a repository copyright-header policy.
  "--ignore=COM812,D203,D213,CPY001",
  # Keep assertions native to the existing dependency-free unittest runner.
  "--per-file-ignores=tests/*.py:PT009",
  "--per-file-ignores=tests/*.py:PT027",
]

[[repos.hooks]]
id = "ruff-format"
name = "Format Python with Ruff"
args = ["--isolated", "--target-version=py312"]

# Local syntax checks and regression tests
[[repos]]
repo = "local"

[[repos.hooks]]
id = "zsh-syntax"
name = "Check zsh syntax"
entry = "zsh -n"
language = "system"
files = '(^|/)(\.zshrc|.*\.zsh)$'

[[repos.hooks]]
id = "python-syntax"
name = "Check Python syntax"
entry = """python3 -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]'"""
language = "system"
files = '\.py$'

[[repos.hooks]]
id = "script-tests"
name = "Test command-line utilities"
entry = "python3 -m unittest discover -s tests"
language = "system"
pass_filenames = false
files = '^tests/.*\.py$|^(Makefile|(core|desktop|nvim)/Makefile|nvim/.*\.(lua|sh))$'

[[repos.hooks]]
id = "commit-message"
name = "Check Conventional Commit messages"
language = "system"
stages = ["commit-msg"]
entry = '''sh -c '
  types="build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
  grep -m1 -Ev "^(#|$)" "$1" |
    grep -Eiq "^(($types)(\([^)]+\))?!?: .+|(Merge|Revert) |(amend|fixup|squash)! )" && exit
  echo "Use type(scope): description, for example: fix(core): handle empty input" >&2
  exit 1
' sh'''

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.5.2"

[[repos.hooks]]
id = "stylua"
name = "Format Lua with StyLua"
files = '^nvim/.+\.lua$'

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"

[[repos.hooks]]
id = "typos"
name = "Check spelling with typos"
# Report rather than rewrite identifiers or configuration values.
args = ["--force-exclude"]

# GitHub Actions hooks
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

[[repos.hooks]]
id = "actionlint"
name = "Lint GitHub Actions workflows"
description = "Lint GitHub Actions workflow files"
files = '^\.github/workflows/.*\.(yml|yaml)$'
