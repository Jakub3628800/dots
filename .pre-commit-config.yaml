# ===============================================================================
# Generated by pre-commit-template v0.1.1
# Repository: https://github.com/Jakub3628800/pre-commit-template
# Generated: 2025-12-21T09:35:34Z
#
# Detected technologies: docker, github-actions
#
# To regenerate: pre-commit-template [--interactive]
# ===============================================================================
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # =====================
  # Base hooks
  # =====================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
      name: Trim trailing whitespace
    - id: end-of-file-fixer
      name: Fix end of files
    - id: check-yaml
      name: Check YAML
    - id: check-json
      name: Check JSON
    - id: check-toml
      name: Check TOML
    - id: check-added-large-files
      name: Check for added large files
    - id: check-merge-conflict
      name: Check for merge conflict strings
    - id: detect-private-key
      name: Detect private keys
    - id: detect-aws-credentials
      name: Detect AWS credentials
      args: [--allow-missing-credentials]
    - id: no-commit-to-branch
      name: Prevent commits to main/master
      always_run: false
      args: [--branch, main, --branch, master]
    - id: check-case-conflict
      name: Check for case conflicts
    - id: check-executables-have-shebangs
      name: Check executables have shebangs
    - id: check-symlinks
      name: Check tracked symlink targets
    - id: destroyed-symlinks
      name: Check for symlinks replaced with text

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    - id: gitleaks
      name: Detect hardcoded secrets with Gitleaks

  # =====================
  # Docker hooks
  # =====================
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
    - id: hadolint-docker
      name: Lint Dockerfiles with hadolint
      files: (^|/)Dockerfile$
      types: [dockerfile]
      args: [--ignore, DL3008]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
    - id: shellcheck
      name: Lint shell scripts with ShellCheck
      files: (^|/)([^/]*\.sh|install-nvim\.sh|screencopy|screensave|pass-type|\.bash_aliases)$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
    - id: shfmt
      name: Format shell scripts with shfmt
      args: [--write, --indent, '4']
      files: (^|/)([^/]*\.sh|screencopy|screensave|pass-type|\.bash_aliases)$
      exclude_types: [csh, tcsh, zsh]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    - id: ruff-check
      name: Lint Python with Ruff
      args:
      - --isolated
      - --target-version=py312
      - --select=ALL
      - --fix
      # COM812 overlaps the formatter; D203/D213 conflict with D211/D212.
      # CPY001 would require inventing a repository copyright-header policy.
      - --ignore=COM812,D203,D213,CPY001
      # These programs deliberately print their CLI output, not debug messages.
      - --per-file-ignores=core/home/.local/bin/cmd-picker:T201
      - --per-file-ignores=core/home/.local/bin/pomo:T201
      # Keep assertions native to the existing dependency-free unittest runner.
      - --per-file-ignores=tests/*.py:PT009
      - --per-file-ignores=tests/*.py:PT027
      # The extensionless utilities use a uv shebang, not a Python shebang.
      types_or: [file]
      files: (^|/)(cmd-picker|pomo|.*\.py)$
    - id: ruff-format
      name: Format Python with Ruff
      args: [--isolated, --target-version=py312]
      types_or: [file]
      files: (^|/)(cmd-picker|pomo|.*\.py)$

  - repo: local
    hooks:
    - id: zsh-syntax
      name: Check zsh syntax
      entry: zsh -n
      language: system
      files: (^|/)(\.zshrc|.*\.zsh)$
    - id: python-syntax
      name: Check Python syntax
      entry: python3 -c 'import pathlib, sys; [compile(pathlib.Path(path).read_bytes(), path, "exec") for path in sys.argv[1:]]'
      language: system
      files: (^|/)(cmd-picker|pomo|.*\.py)$
    - id: script-tests
      name: Test command-line utilities
      entry: python3 -m unittest discover -s tests
      language: system
      pass_filenames: false
      files: (^|/)(cmd-picker|pomo)$|^tests/.*\.py$|^nvim/(Makefile|test-config\.lua)$

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
    - id: stylua
      name: Format Lua with StyLua
      files: ^(nvim/.+\.lua|desktop/home/\.wezterm\.lua)$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
    - id: markdownlint-cli2
      name: Lint Markdown
      # Use a full version for compatibility with pre-commit's nodeenv runner.
      language_version: '22.23.2'

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
    - id: typos
      name: Check spelling with typos
      # Report rather than rewrite identifiers or configuration values.
      args: [--force-exclude]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
    - id: conventional-pre-commit
      name: Check Conventional Commit messages
      stages: [commit-msg]

  # =====================
  # GitHub Actions hooks
  # =====================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    - id: actionlint
      name: Lint GitHub Actions workflows
      description: Lint GitHub Actions workflow files
      files: '^\.github/workflows/.*\.(yml|yaml)$'
